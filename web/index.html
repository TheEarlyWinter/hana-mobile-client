<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" id="metaThemeColor" content="#F8F4ED" />
<!--
  首帧定色：app.js 是 ES module（defer 执行），等它读本地偏好会先画一帧浅色。
  这里的键名与色值跟 web/theme.js 的 STORAGE_KEY_THEME / THEME_META_COLORS 保持一致，
  改一处必须改两处。
-->
<script>
  (function () {
    try {
      var mode = localStorage.getItem('hana-mobile:theme');
      if (mode !== 'light' && mode !== 'dark') {
        mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = mode;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', mode === 'dark' ? '#171310' : '#F8F4ED');
    } catch (err) {
      /* 隐私模式 / 存储被禁：交给 theme.js 按默认处理 */
    }
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes" />
<!-- 壳靠这个标记认出「这是我们自己的页面」：没有它，返回键不会直接退出，而是先问用户 -->
<meta name="hana-shell" content="1" />
<title>Hana</title>
<!-- 样式表全部合成一份：顺序即层叠顺序，登记在 scripts/build-web.mjs 的 STYLES 里。
     原本 20 个 <link>，网关对文本资源发 no-store，冷启动等于 20 次往返。 -->
<link rel="stylesheet" href="/dist/app.css" />
</head>
<body>
<div class="paper-layer" aria-hidden="true"></div>

<!-- 启动盘底：任何未捕获的错误都弹在这里，宁可丑也不能白屏 -->
<div id="bootError" class="boot-error" hidden></div>

<!-- 登录 -->
<main id="view-login" class="view" hidden>
  <div class="login-box">
    <div class="brand">HanaAgent</div>
    <p class="hint" id="loginHint">登录后继续</p>

    <input id="inUser" class="field" placeholder="用户名" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" />
    <input id="inPass" class="field" type="password" placeholder="密码" autocomplete="current-password" />

    <button id="btnLogin" class="btn-primary" type="button">登录</button>
    <p class="err" id="loginErr"></p>
    <!-- 登录页也要能改接入方式：换网络或隧道换了地址时，页面本身打得开，
         但此刻还没有侧边栏可点。 -->
    <button type="button" class="login-server-btn" id="btnLoginServerMode">接入方式</button>
  </div>
</main>

<!-- 主页 / 会话 -->
<main id="view-list" class="view view-home" hidden>
  <!-- 浅色液态弥散光斑底层 -->
  <div class="liquid-auras" aria-hidden="true">
    <div class="aura aura-peach"></div>
    <div class="aura aura-sky"></div>
    <div class="aura aura-violet"></div>
  </div>

  <header class="home-head">
    <div class="home-head-left">
      <button class="icon-btn liquid-btn" id="btnOpenDrawer" title="历史会话与项目" aria-label="打开侧边栏">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 6h16M4 12h10M4 18h16" />
        </svg>
      </button>
      <div class="home-brand">
        <span class="wordmark">HanaAgent</span>
        <span class="conn-dot dot" id="connDot"></span>
      </div>
    </div>
    <div class="home-head-actions" id="homeHeadActions">
      <button class="icon-btn liquid-btn" id="btnRefresh" title="刷新" aria-label="刷新">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 4v5h-5" />
        </svg>
      </button>
      <button class="icon-btn liquid-btn" id="btnNew" title="新建 Chat 对话" aria-label="新建 Chat 对话">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>
    </div>
  </header>

  <!-- 主页陪伴与启动台核心区 -->
  <div class="home-stage" id="homeStage">
    <!-- 居中陪伴区 -->
    <div class="companion-hero" id="companionHero">
      <div class="hero-avatar-ring">
        <div class="hero-avatar" id="heroAgentAvatar">H</div>
      </div>
      <h2 class="hero-greeting" id="heroGreeting">有什么需要帮忙的吗？</h2>
    </div>

    <!-- Agent 横向滑轨 -->
    <div class="agent-carousel-wrapper">
      <div class="agent-carousel" id="agentCarousel">
        <!-- 动态挂载各 Agent 药丸胶囊 -->
      </div>
      <div class="hero-subhint" id="homeMemoryHint">◇ 新建 Chat 对话，参考长期记忆</div>
    </div>

    <!-- 日报报纸露角位于输入岛左上沿；输入器保持原 ID 与内部控件。 -->
    <div class="feed-composer-dock" id="homeComposerDock">
      <div class="home-composer-card feed-composer-surface" id="homeComposer">
        <textarea id="homeInput" class="home-input" rows="2" placeholder="不同助手可以设置不同主文件夹，开启巡检后会在那里自主行动" autocomplete="off" autocorrect="off"></textarea>

        <!-- 主页附件托盘（若有选择图片） -->
        <div id="homeAttachBar" class="home-attach-bar" hidden></div>

        <div class="home-composer-bar">
          <div class="composer-bar-left">
            <button type="button" class="composer-chip-btn" id="homeWorkspaceChip" title="工作目录">
              <span class="chip-text" id="homeWorkspaceName">工作区</span>
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <button type="button" class="icon-chip-btn" id="btnHomeAttach" title="添加附件" aria-label="添加附件">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>

          <div class="composer-bar-right">
            <button type="button" class="icon-chip-btn" id="btnHomeThinking" title="思考模式" aria-label="思考模式">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v2M12 16v2M6 12h2M16 12h2"/></svg>
            </button>
            <button type="button" class="composer-chip-btn chip-model" id="homeModelChip" title="当前模型">
              <span class="chip-text" id="homeModelName">DeepSeek V4.1</span>
            </button>
            <button type="button" class="btn-home-send" id="btnHomeSend" title="发送">
              <span>发送</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部拉手：轻点或上滑展开历史会话 -->
    <div class="recent-drawer-peek" id="btnPeekRecent">
      <div class="peek-pill"></div>
      <div class="peek-title">
        <span>历史会话与最近足迹</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>
      </div>
    </div>
  </div>

  <!-- 侧边历史会话与项目抽屉 (Slide Drawer) -->
  <div class="history-drawer-mask" id="drawerMask" hidden></div>
  <aside class="history-drawer-panel" id="drawerPanel" aria-hidden="true">
    <div class="drawer-head">
      <div class="drawer-title-group">
        <span class="drawer-title">会话与项目</span>
        <span class="drawer-sub">HanaAgent 工作台</span>
      </div>
      <button class="icon-btn liquid-btn" id="btnCloseDrawer" title="关闭" aria-label="关闭侧边栏">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="home-scroll drawer-scroll" id="homeScroll">
      <button class="new-chat-btn liquid-btn" id="btnNewChat" title="新建 Chat 对话" aria-label="新建 Chat 对话">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14" />
        </svg>
        <span>新建 Chat 对话</span>
      </button>

      <!-- 会话类型筛选：只切换列表视角；新建入口始终创建 Chat 会话 -->
      <div class="session-namespace-tabs" id="sessionNamespaceTabs" role="group" aria-label="会话类型">
        <button type="button" class="namespace-tab is-active" id="btnNamespaceHome" aria-pressed="true">Chat</button>
        <button type="button" class="namespace-tab" id="btnNamespaceCode" aria-pressed="false">Code</button>
      </div>

      <div id="sessionList" class="session-list"></div>
    </div>

    <footer class="home-foot drawer-foot">
      <!-- 整行就是「设置」入口：底部只留用户身份，低频配置（接入方式）与破坏性操作（退出登录）收进设置面板 -->
      <div class="foot-user" id="btnSettings" role="button" tabindex="0" aria-label="打开设置">
        <div class="avatar avatar-user" id="userAvatar">催</div>
        <div class="foot-user-text">
          <div class="foot-user-name" id="userName">你</div>
          <div class="foot-user-meta" id="agentName">Hana</div>
        </div>
        <span class="foot-user-chevron" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </span>
      </div>
    </footer>
  </aside>
</main>

<!-- 聊天 -->
<main id="view-chat" class="view view-chat" hidden>
  <header class="chat-head">
    <button class="icon-btn" id="btnBack" title="返回" aria-label="返回">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 18l-6-6 6-6" />
      </svg>
    </button>
    <div class="chat-head-title">
      <div class="chat-title" id="chatTitle">会话</div>
      <div class="chat-sub" id="chatSub"></div>
    </div>
    <button class="icon-btn" id="btnRepo" title="仓库" aria-label="仓库" hidden>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="6" cy="6" r="2.4" />
        <circle cx="6" cy="18" r="2.4" />
        <circle cx="18" cy="9" r="2.4" />
        <path d="M6 8.4v7.2" />
        <path d="M18 11.4c0 3-2.4 3.6-6 3.6" />
      </svg>
    </button>
    <button class="icon-btn" id="btnWorkspace" title="工作区" aria-label="工作区">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
      </svg>
    </button>
    <button class="icon-btn" id="btnMenu" title="更多" aria-label="更多" hidden>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <circle cx="5" cy="12" r="1.6" /><circle cx="12" cy="12" r="1.6" /><circle cx="19" cy="12" r="1.6" />
      </svg>
    </button>
  </header>

  <!-- 内容面：纸是外壳，消息落在这张卡上，标题栏留在纸面 -->
  <div class="chat-page">
    <div id="chatSkeleton" class="chat-skeleton" hidden aria-hidden="true">
      <div class="skeleton-row skeleton-user">
        <div class="skeleton-bubble skeleton-user-bubble"></div>
        <div class="skeleton-avatar"></div>
      </div>
      <div class="skeleton-row skeleton-agent">
        <div class="skeleton-avatar"></div>
        <div class="skeleton-agent-lines">
          <div class="skeleton-line line-short"></div>
          <div class="skeleton-line line-long"></div>
          <div class="skeleton-line line-medium"></div>
        </div>
      </div>
      <div class="skeleton-row skeleton-user">
        <div class="skeleton-bubble skeleton-user-bubble" style="width: 170px;"></div>
        <div class="skeleton-avatar"></div>
      </div>
      <div class="skeleton-row skeleton-agent">
        <div class="skeleton-avatar"></div>
        <div class="skeleton-agent-lines">
          <div class="skeleton-line line-long"></div>
          <div class="skeleton-line line-medium"></div>
        </div>
      </div>
    </div>
    <div id="transcript" class="transcript"></div>

    <div id="composer" class="composer-area">
      <div id="attachBar" class="attach-bar" hidden></div>

      <div class="composer-card">
        <textarea id="input" class="composer-input" rows="1" placeholder="想说什么都可以…"></textarea>

        <div class="composer-tools">
        <button id="btnAttach" class="tool-btn" title="加附件" aria-label="加附件">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>

        <span class="composer-spacer"></span>

        <span class="model-chip" id="modelChip" hidden></span>

        <button id="btnSend" class="send-btn" disabled>
          <svg class="send-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 19V5" /><path d="M5 12l7-7 7 7" />
          </svg>
          <span class="send-label">发送</span>
        </button>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- 附件来源选择 -->
<div id="attachSheet" class="sheet" hidden>
  <div class="sheet-panel">
    <button class="sheet-item" data-act="camera">拍照</button>
    <button class="sheet-item" data-act="gallery">从相册选</button>
    <button class="sheet-item" data-act="document">发文件</button>
    <button class="sheet-item sheet-cancel" data-act="cancel">取消</button>
  </div>
</div>

<input type="file" id="pickCamera" accept="image/*" capture="environment" hidden />
<input type="file" id="pickGallery" accept="image/*" multiple hidden />
<!-- 文档：宿主只收「先上传成会话文件」那条路，类型白名单以 /api/upload-blob 为准。
     accept 里带 application/octet-stream 是故意的：Android 文件管理器常常不报具体
     MIME，不放它就连 .md/.py 都选不到；真不支持的扩展名由前端挡下并提示。 -->
<input type="file" id="pickDocument" multiple accept="application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/rtf,application/json,application/zip,application/x-zip-compressed,text/*,audio/mpeg,audio/wav,audio/mp4,audio/ogg,audio/flac,application/octet-stream" hidden />

<!-- 全屏看图 -->
<div id="lightbox" class="lightbox" hidden>
  <img id="lightboxImg" alt="" />
</div>

<!-- 调试抽屉 -->
<div id="debug" class="debug" hidden>
  <div class="debug-head">
    <span>原始事件</span>
    <button class="icon-btn" id="btnDebugClose">×</button>
  </div>
  <pre id="debugBody"></pre>
</div>

<!-- 设置面板挂载点（settings-view 自己在这里建 DOM） -->
<div id="settingsContainer"></div>

<!-- 入口：整个模块图已打成一份（scripts/build-web.mjs），源文件仍在 web/ 下供测试与排查。 -->
<script src="/dist/app.js" type="module"></script>
</body>
</html>
