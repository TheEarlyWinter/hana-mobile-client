<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>设置服务器地址</title>
<style>
  :root {
    --paper: #f7f1e7; --ink: #2f2a24; --sub: #8a7f70;
    --line: #e2d8c8; --accent: #2f6fb3; --bad: #b3452f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  body { padding: calc(env(safe-area-inset-top) + 48px) 22px calc(env(safe-area-inset-bottom) + 24px);
    display: flex; flex-direction: column; }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: .02em; }
  .sub { color: var(--sub); font-size: 13px; line-height: 1.65; margin: 0 0 24px; }
  .reason { background: #fbece7; color: var(--bad); border-radius: 10px; padding: 10px 12px;
    font-size: 13px; margin-bottom: 18px; line-height: 1.5; }
  label { font-size: 12px; color: var(--sub); letter-spacing: .04em; margin-bottom: 7px; display: block; }
  input { width: 100%; padding: 14px; border: 1px solid var(--line); border-radius: 12px;
    background: #fffdf9; font-size: 16px; color: var(--ink); outline: none; }
  input:focus { border-color: var(--accent); }
  button { width: 100%; margin-top: 14px; padding: 15px; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 600; }
  .hint { margin-top: 26px; font-size: 12.5px; color: var(--sub); line-height: 1.85; }
  .hint code { background: #ece3d4; border-radius: 5px; padding: 1px 6px; font-size: 12px; }
  .spacer { flex: 1 1 auto; }
</style>
</head>
<body>
  <h1>连哪一台</h1>
  <p class="sub">填这台电脑上网关的地址。<br>同一个 Wi-Fi 用局域网 IP；不在同一网络用 Tailscale 的 100.x 地址。</p>

  <div id="reason" class="reason" hidden></div>

  <label for="url">服务器地址</label>
  <input id="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="http://192.168.31.89:24000/" />
  <button id="save">保存并连接</button>

  <div class="spacer"></div>

  <div class="hint">
    常见填法：<br>
    · 同一 Wi-Fi：<code>192.168.31.89:24000</code><br>
    · Tailscale：<code>100.x.x.x:24000</code>（手机装 Tailscale 并登录同一账号）<br>
    · 网关必须在那台电脑上跑着，桌面端也要开着
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const bridge = window.HanaBridge;

  const params = new URLSearchParams(location.search);
  const reason = params.get('reason');
  if (reason) {
    $('reason').hidden = false;
    $('reason').textContent = reason;
  }

  const current = (bridge && bridge.currentUrl && bridge.currentUrl()) || '';
  const fallback = (bridge && bridge.defaultUrl && bridge.defaultUrl()) || '';
  $('url').value = current || fallback;

  $('save').addEventListener('click', () => {
    const v = $('url').value.trim();
    if (!v) return;
    if (bridge && bridge.saveUrl) bridge.saveUrl(v);
  });
</script>
</body>
</html>
